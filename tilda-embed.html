<!-- Tilda Zero Block HTML: interactive camera inspector. Change 001 to 002...008. -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<div class="lmh-3d-wrap" style="position:relative;width:100%;height:100%;min-height:320px">
  <model-viewer id="lmh-viewer"
    src="https://rallyvitaly-eng.github.io/tilda-3d-models/%D0%9B%D0%9C%D0%A5.2026.001.glb"
    camera-controls disable-pan
    camera-orbit="45deg 75deg auto"
    shadow-intensity="0.6"
    loading="eager"
    style="display:block;width:100%;height:100%;background:transparent">
  </model-viewer>
  <div id="lmh-camera-panel" style="position:absolute;left:12px;bottom:12px;z-index:10;padding:12px 14px;border-radius:10px;background:rgba(20,20,20,.88);color:white;font:12px/1.5 Arial,sans-serif;max-width:calc(100% - 24px);box-sizing:border-box">
    <div style="font-weight:bold;margin-bottom:6px">Camera inspector</div>
    <div id="lmh-camera-values" style="font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere">Загрузка модели…</div>
    <button id="lmh-camera-copy" type="button" style="margin-top:9px;padding:7px 12px;border:0;border-radius:5px;background:#fff;color:#111;cursor:pointer;font:12px Arial,sans-serif">Скопировать ракурс</button>
  </div>
</div>
<script>
(function(){
  const root=document.currentScript.previousElementSibling;
  const viewer=root.querySelector('model-viewer');
  const values=root.querySelector('#lmh-camera-values');
  const copy=root.querySelector('#lmh-camera-copy');
  let output='';
  function update(){
    if(typeof viewer.getCameraOrbit!=='function')return;
    const orbit=viewer.getCameraOrbit();
    const deg=180/Math.PI;
    const theta=(orbit.theta*deg).toFixed(1);
    const phi=(orbit.phi*deg).toFixed(1);
    const radius=orbit.radius.toFixed(3);
    output='camera-orbit="'+theta+'deg '+phi+'deg '+radius+'m"';
    values.textContent=output;
  }
  viewer.addEventListener('camera-change',update);
  viewer.addEventListener('load',update);
  customElements.whenDefined('model-viewer').then(update);
  copy.addEventListener('click',async()=>{
    update();
    try{await navigator.clipboard.writeText(output);copy.textContent='Скопировано!'}
    catch(e){const field=document.createElement('textarea');field.value=output;document.body.appendChild(field);field.select();document.execCommand('copy');field.remove();copy.textContent='Скопировано!'}
    setTimeout(()=>copy.textContent='Скопировать ракурс',1600);
  });
})();
</script>
