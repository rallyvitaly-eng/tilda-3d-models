<!-- Place this HTML block ABOVE a separate static image in Tilda Zero Block.
     Duplicate for each card and change data-model="001" to 002...008. -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<div class="lmh-3d" data-model="001" style="position:relative;width:100%;height:100%;min-height:320px;cursor:move;touch-action:pan-y">
  <model-viewer camera-controls disable-zoom disable-pan loading="eager"
    shadow-intensity="0.6" interaction-prompt="none"
    style="display:block;width:100%;height:100%;background:#F6F6F6;opacity:0;transition:opacity .25s ease;pointer-events:none;cursor:move">
  </model-viewer>
</div>
<script>
(function(){
  const root=document.currentScript.previousElementSibling;
  const viewer=root.querySelector('model-viewer');
  const n=root.dataset.model;
  const cameras={
    '001':'584.0deg 6.8deg 0.925m',
    '002':'240.4deg 11.5deg 1.856m',
    '003':'265.1deg 5.5deg 0.919m',
    '004':'109.3deg 6.9deg 2.665m',
    '005':'39.1deg 30.5deg 2.523m',
    '006':'58.2deg 5.2deg 1.811m',
    '007':'79.0deg 0.0deg 2.710m',
    '008':'-46.2deg 0.4deg 2.732m'
  };
  if(!cameras[n])return;
  viewer.setAttribute('camera-orbit',cameras[n]);
  // Force the cursor on the actual interactive elements inside model-viewer.
  // The component can assign 'grab'/'grabbing' dynamically via inline styles.
  customElements.whenDefined('model-viewer').then(()=>{
    viewer.style.setProperty('cursor','move','important');
    const shadow=viewer.shadowRoot;
    if(!shadow)return;
    const applyCursor=()=>{
      for(const el of shadow.querySelectorAll('*')){
        if(el.style && (el.style.getPropertyValue('cursor')!=='move' ||
            el.style.getPropertyPriority('cursor')!=='important')){
          el.style.setProperty('cursor','move','important');
        }
      }
    };
    applyCursor();
    const observer=new MutationObserver(applyCursor);
    observer.observe(shadow,{subtree:true,attributes:true,attributeFilter:['style','class'],childList:true});
    viewer.addEventListener('pointerenter',applyCursor);
    viewer.addEventListener('pointerdown',applyCursor);
  });
  if(window.matchMedia('(max-width:767px)').matches){
    viewer.setAttribute('minimum-render-scale','0.5');
    viewer.setAttribute('shadow-intensity','0');
  }
  // Nothing is downloaded until a user interacts with a card.
  // A shared queue prevents multiple GLB downloads starting simultaneously.
  if(!window.__lmhHoverQueue){
    window.__lmhHoverQueue={
      pending:[],busy:false,
      add(item){
        this.pending.push(item);
        this.next();
      },
      next(){
        if(this.busy||!this.pending.length)return;
        const item=this.pending.shift();
        this.busy=true;
        let finished=false;
        const finish=()=>{
          if(finished)return;
          finished=true;
          clearTimeout(timeout);
          this.busy=false;
          this.next();
        };
        item.viewer.addEventListener('load',()=>{
          item.loaded=true;
          if(item.active)item.show();
          finish();
        },{once:true});
        item.viewer.addEventListener('error',()=>{
          item.root.style.cursor='move';
          finish();
        },{once:true});
        const timeout=setTimeout(finish,45000);
        item.viewer.src='https://rallyvitaly-eng.github.io/tilda-3d-models/'+encodeURIComponent('ЛМХ.2026.'+item.n+'.glb');
      }
    };
  }
  const item={
    root,viewer,n,loaded:false,active:false,requested:false,
    show(){
      viewer.style.opacity='1';
      viewer.style.pointerEvents='auto';
    },
    hide(){
      viewer.style.opacity='0';
      viewer.style.pointerEvents='none';
    },
    request(){
      if(!this.requested){
        this.requested=true;
        window.__lmhHoverQueue.add(this);
      }
      if(this.loaded)this.show();
    }
  };
  const hasHover=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(hasHover){
    root.addEventListener('pointerenter',()=>{
      item.active=true;
      item.request();
    });
    root.addEventListener('pointerleave',()=>{
      item.active=false;
      item.hide();
    });
  }else{
    root.addEventListener('click',()=>{
      item.active=true;
      item.request();
    });
  }
})();
</script>
